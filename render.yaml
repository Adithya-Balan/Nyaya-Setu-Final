services:
  # Backend API Service
  - type: web
    name: ccms-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.11.0 # Or your required Python version

  # Frontend Dashboard
  - type: web
    name: ccms-dashboard
    env: node
    rootDir: ccms-dashboard
    buildCommand: npm install && npm run build
    startCommand: npm run preview
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_URL
        fromService:
          type: web
          name: ccms-backend
          envVarKey: RENDER_EXTERNAL_URL
